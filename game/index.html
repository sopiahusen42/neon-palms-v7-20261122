<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON PALMS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff8a6a'/%3E%3Ccircle cx='11' cy='5' r='3' fill='%23ffe9b8'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #8fc4e8; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #gl { z-index: 1; }
  #hud { z-index: 2; pointer-events: none; }
  #boot {
    position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#8ec6ea, #ffe6c0); color: #113049;
    font: 700 14px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: 4px;
  }
  #boot.gone { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
</div>
<div id="boot">NEON PALMS &nbsp;·&nbsp; LOADING</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
